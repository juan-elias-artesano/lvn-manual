<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#03060c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#B98A1F"/>
      <stop offset="0.35" stop-color="#F5C542"/>
      <stop offset="0.55" stop-color="#FFE9A0"/>
      <stop offset="0.75" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#B98A1F"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5C542" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5C542" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F5C542" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5C542" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F5C542" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridP" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1c2a44" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>
